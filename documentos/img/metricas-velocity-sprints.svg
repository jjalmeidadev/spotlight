<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Velocity por sprint</title>
  <desc id="desc">Grafico de barras com pontos entregues: Sprint 1 111, Sprint 2 145, Sprint 3 139, Sprint 4 159, Sprint 5 65.</desc>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111412">Velocity por sprint</text>
  <text x="32" y="56" font-family="Arial, sans-serif" font-size="12" fill="#5f625d">Pontos entregues por sprint, conforme consolidado no painel de metricas.</text>
  <line x1="80" y1="292" x2="780" y2="292" stroke="#c9cbc5" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="292" stroke="#c9cbc5" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#747871">
    <text x="51" y="296">0</text>
    <text x="45" y="246">40</text>
    <text x="45" y="193">80</text>
    <text x="38" y="140">120</text>
    <text x="38" y="87">160</text>
  </g>
  <g stroke="#eef0eb" stroke-width="1">
    <line x1="80" y1="239" x2="780" y2="239"/>
    <line x1="80" y1="186" x2="780" y2="186"/>
    <line x1="80" y1="133" x2="780" y2="133"/>
    <line x1="80" y1="80" x2="780" y2="80"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="125" y="145" width="82" height="147" rx="5" fill="#2a78d6"/>
    <text x="166" y="135" fill="#111412" font-weight="700">111</text>
    <text x="166" y="318" fill="#5f625d">Sprint 1</text>
    <rect x="260" y="100" width="82" height="192" rx="5" fill="#2a78d6"/>
    <text x="301" y="90" fill="#111412" font-weight="700">145</text>
    <text x="301" y="318" fill="#5f625d">Sprint 2</text>
    <rect x="395" y="108" width="82" height="184" rx="5" fill="#2a78d6"/>
    <text x="436" y="98" fill="#111412" font-weight="700">139</text>
    <text x="436" y="318" fill="#5f625d">Sprint 3</text>
    <rect x="530" y="81" width="82" height="211" rx="5" fill="#1baf7a"/>
    <text x="571" y="71" fill="#111412" font-weight="700">159</text>
    <text x="571" y="318" fill="#5f625d">Sprint 4</text>
    <rect x="665" y="206" width="82" height="86" rx="5" fill="#898781"/>
    <text x="706" y="196" fill="#111412" font-weight="700">65</text>
    <text x="706" y="318" fill="#5f625d">Sprint 5</text>
  </g>
</svg>
