<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Lead time medio por sprint</title>
  <desc id="desc">Grafico de linha com lead time medio em dias: Sprint 1 2.0, Sprint 2 3.8, Sprint 3 4.9, Sprint 4 6.0, Sprint 5 8.0.</desc>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111412">Lead time medio por sprint</text>
  <text x="32" y="56" font-family="Arial, sans-serif" font-size="12" fill="#5f625d">Tempo medio entre criacao e fechamento das issues, em dias.</text>
  <line x1="80" y1="292" x2="780" y2="292" stroke="#c9cbc5" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="292" stroke="#c9cbc5" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#747871">
    <text x="55" y="296">0</text>
    <text x="55" y="243">2</text>
    <text x="55" y="190">4</text>
    <text x="55" y="137">6</text>
    <text x="55" y="84">8</text>
  </g>
  <g stroke="#eef0eb" stroke-width="1">
    <line x1="80" y1="239" x2="780" y2="239"/>
    <line x1="80" y1="186" x2="780" y2="186"/>
    <line x1="80" y1="133" x2="780" y2="133"/>
    <line x1="80" y1="80" x2="780" y2="80"/>
  </g>
  <polyline points="140,239 290,191 440,162 590,133 740,80" fill="none" stroke="#e34948" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e34948" stroke="#ffffff" stroke-width="3">
    <circle cx="140" cy="239" r="7"/>
    <circle cx="290" cy="191" r="7"/>
    <circle cx="440" cy="162" r="7"/>
    <circle cx="590" cy="133" r="7"/>
    <circle cx="740" cy="80" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="140" y="225" fill="#111412" font-weight="700">2,0</text>
    <text x="290" y="177" fill="#111412" font-weight="700">3,8</text>
    <text x="440" y="148" fill="#111412" font-weight="700">4,9</text>
    <text x="590" y="119" fill="#111412" font-weight="700">6,0</text>
    <text x="740" y="66" fill="#111412" font-weight="700">8,0</text>
    <text x="140" y="318" fill="#5f625d">Sprint 1</text>
    <text x="290" y="318" fill="#5f625d">Sprint 2</text>
    <text x="440" y="318" fill="#5f625d">Sprint 3</text>
    <text x="590" y="318" fill="#5f625d">Sprint 4</text>
    <text x="740" y="318" fill="#5f625d">Sprint 5</text>
  </g>
</svg>
