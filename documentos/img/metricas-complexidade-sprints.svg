<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">Distribuicao de complexidade por sprint</title>
  <desc id="desc">Grafico de barras empilhadas com issues SIZE_G, SIZE_M e SIZE_P por sprint.</desc>
  <rect width="820" height="390" fill="#ffffff"/>
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111412">Distribuicao de complexidade por sprint</text>
  <text x="32" y="56" font-family="Arial, sans-serif" font-size="12" fill="#5f625d">Quantidade de issues fechadas por tamanho estimado.</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#5f625d">
