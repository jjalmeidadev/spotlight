    <rect x="620" y="28" width="12" height="12" fill="#1baf7a"/><text x="638" y="39">SIZE_M</text>
    <rect x="700" y="28" width="12" height="12" fill="#eda100"/><text x="718" y="39">SIZE_P</text>
  </g>
